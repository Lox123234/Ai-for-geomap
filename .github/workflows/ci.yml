name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual runs also upload the portable Windows build

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Build, test and deploy
        shell: pwsh
        run: ./scripts/build-windows.ps1 -QtDir "$env:QT_ROOT_DIR" -Zip

      - name: Upload portable build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GeoMapAI-windows-x64
          path: dist/GeoMapAI-*-win64.zip
          retention-days: 14

  linux:
    name: Linux x64 (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Test
        run: ctest --preset linux-release
